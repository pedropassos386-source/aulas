        <link rel="stylesheet" href="css/style.css">

        <style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

div.box{
    width: 300px;
    height: 300px;
    background-color: green;
    transition: 2s;
}

div.box:hover{
    width: 600px;
    height: 100px;
    background-color: blueviolet;
}
        </style>
    </head>
    <body>
        <div class="box">

        </div><!--box-->
