<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, inicial-scale=1.0, maximum-scale=1.0">
  <title>Float e inline-block para o responsivo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    .box {
      border: 1px solid black;
      width: 33.3%;
      height: 300px;
      max-width: 300px;
      background-color: green;
      display: inline-block;    
      margin-right: -4px;
    }
    .conteiner{
      padding: 30px 0;
      background-color: blueviolet;
      text-align: center;
    }

    @media screen and (max-width:768px){
      /* .conteiner{
        text-align: center; 
      }
      .box{
        width: 40%;
        float: none;
        display: inline-block;
        margin-bottom: -4px;
      } */
    }
  </style>
</head>

<body>
  <div class="conteiner">
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div><
  </div><!--Container-->
</body>

</html>
