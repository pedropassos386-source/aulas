<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Porcentagem em margin e padding</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            width: 50%;
            margin-left: 50%;
            padding-top: 25%;
            background-color: blueviolet;
            display: inline-block;
        }
        .parente{
            width: 50%;
            height: 400px;
            background-color: blue;
        }
    </style>
</head>

<body>
    <div class="parente">
    <div class="box">

    </div><!--box-->
    </div><!--parente-->
</body>

</html>
