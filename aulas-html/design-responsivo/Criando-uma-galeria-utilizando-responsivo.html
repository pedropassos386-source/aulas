<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Criando uma galeria utilizando responsivo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .clear {
            clear: both;
        }

        .container {
            width: 100%;
            max-width: 1280px;
            margin: 20px auto;
            padding: 30px 0;
            border: 3px solid rgb(220, 220, 220);
        }

        .img-wraper {
            width: 33.3%;
            padding-top: calc(33.3% / 1.6);
            float: left;
            background-color: white;
            position: relative;
            border: 4px solid white;
        }

        .img {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-position: center;
            background-size: contain;
            background-repeat: no-repeat;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="img-wraper">
            <div style="background-image: url(/projeto/assets/the-boys-homelander-antony-starr.jpg);" class="img"></div>
        </div><!--Img-wraper-->

        <div class="img-wraper">
            <div style="background-image: url(/projeto/assets/the-boys-homelander-antony-starr.jpg);" class="img"></div>
        </div><!--Img-wraper-->

        <div class="img-wraper">
            <div style="background-image: url(/projeto/assets/the-boys-homelander-antony-starr.jpg);" class="img"></div>
        </div><!--Img-wraper-->

        <div class="img-wraper">
            <div style="background-image: url(/projeto/assets/the-boys-homelander-antony-starr.jpg);" class="img"></div>
        </div><!--Img-wraper-->

        <div class="img-wraper">
            <div style="background-image: url(/projeto/assets/the-boys-homelander-antony-starr.jpg);" class="img"></div>
        </div><!--Img-wraper-->

        <div class="img-wraper">
            <div style="background-image: url(/projeto/assets/the-boys-homelander-antony-starr.jpg);" class="img"></div>
        </div><!--Img-wraper-->
        <div class="clear"></div>
    </div><!--container-->
</body>

</html>
