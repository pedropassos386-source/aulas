<!DOCTYPE html>
<html>

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <meta charset="UTF-8">

    <style>
        /* h1{
    font-family: "Roboto";

        .Roboto {
            font-family: "Roboto";
            font-weight: 0;
            letter-spacing: 1px;
            line-height: 50px;
        }
        .open{
            font-family: "open sans";
            font-weight: 700;
        }
    </style>
</head>

<body>
    <div class="Roboto">
        <h1>Aopa meu povo</h1>
    </div>
    <div>
        <p class="open">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Rerum, ex repudiandae beatae delectus minus rem cum
            perspiciatis sed esse magnam, praesentium impedit. Laudantium eius in corporis vel, cupiditate consectetur
            non!</p>
    </div>
</body>

</html>
