<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,
initial-scale=1.0">
    <title> Posicionando elementos na página</title>
    <style>
        header {
            position: fixed;      
            top: 0;   
            left: 0;
            width: 100%;
            text-align: center;
        }

        button{
            position: absolute;
            top: 100%;
            left: 100%;
        }
        .sticky{
            position:sticky;
            bottom: 0;
        }
    </style>
</head>

<body>
    <header>Aqui é um cabeçalho generico</header>
    <button>enviar</button>
    <div class="sticky">Conteúdo Sticky</div>
    <div style="height: 2000px;">Conteúdo longo</div>
</body>

</html>
