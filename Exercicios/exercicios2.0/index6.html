<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title> Estilizando estados dos elementos</title>
    <style>
        ul{
            background-color: blueviolet;
        }
        body ul :hover{
            background-color: red;
        }
        ul :first-child{
            color: aqua;
        }
        ul :last-child{
            border: 1px solid black;
        }
        ul :nth-child(odd){
            background-color: orange;
        }
    </style>
</head>

<body>
<ul>
    <li>Municipio</li>
    <li>Cidade</li>
    <li>Estado</li>
    <li>Pais</li>
    <li>Continente</li>
</ul>
</body>

</html>
