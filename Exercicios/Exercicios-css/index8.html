<!DOCTYPE html>
<html>

<head>
    <title>Reutilizando a mesma classe</title>
    <meta charset="utf-8" />
    <style>
        .botao {
            margin-bottom: 10px;
            background-color: blue;
            color: white;
            border-radius: 50px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <button class="botao">Enviar</button>
    <br />
    <button class="botao">Cancelar</button>
    <br />
    <button class="botao">Voltar</button>

</body>

</html>
