<!DOCTYPE html>
<html>

<head>
    <title>Ultilizar float e as vantagens</title>
    <meta charset="utf=8" />
    <style>
        .box {
            float: left;
            width: 100px;
            height: 100px;
            background-color: red;
            margin: 10px;
        }

        .clear {
            clear: both;
        }
    </style>
</head>

<body>
    <div class="box"></div>
    <div class="box"></div>
    <div class="clear"></div>
    <footer>Rodapé</footer>
</body>

</html>
