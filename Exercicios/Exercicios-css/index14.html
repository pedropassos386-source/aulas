<!DOCTYPE html>
<html>

<head>
    <title>Ultilizar float e as vantagens</title>
    <meta charset="utf=8" />
    <style>
        .box {
            width: 500px;
            height: 500px;
            background-color: red;
            margin: 10px;
            transform: rotate(45deg);

        }

        .flex {
            display: flex;
            justify-content: center;
            width: 100%;
            height: 100vh;
            align-items: center;

        }
    </style>
</head>

<body>
    <div class="flex">
        <div class="box"></div>
    </div>
</body>

</html>
